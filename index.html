<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oportunidades Inmobiliarias - Sonnenland & San Agustín</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --green: #10b981;
      --amber: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 1rem 2rem;
    }

    .header-content {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo-area h1 {
      font-size: 1.35rem;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .badge-count {
      background: #1e1b4b;
      color: #818cf8;
      border: 1px solid #3730a3;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    main {
      max-width: 1280px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      flex: 1;
      width: 100%;
    }

    .filter-bar {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 1.25rem;
      border-radius: 12px;
      margin-bottom: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .search-input, .select-input {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus, .select-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    .btn-filter {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-filter.active, .btn-filter:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #475569;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .card-tags {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .portal-tag {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .type-tag {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
    }
    .type-vivienda { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .type-garaje { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 0.75rem;
      color: #f1f5f9;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-price {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--green);
      margin-bottom: 0.5rem;
    }

    .card-details {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      line-height: 1.5;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .btn-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 0.55rem 1.1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.2s;
      width: 100%;
      justify-content: center;
    }

    .btn-link:hover {
      background: var(--accent-hover);
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }

    footer {
      border-top: 1px solid var(--border-color);
      padding: 1.5rem 2rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 3rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo-area">
        <h1>🏠 Inmuebles & Garajes Sur de Gran Canaria</h1>
        <div class="subtitle">Búsqueda automática semanal • Sonnenland, Maspalomas y San Agustín</div>
      </div>
      <div>
        <span class="badge-count" id="totalCount">Cargando...</span>
      </div>
    </div>
  </header>

  <main>
    <div class="filter-bar">
      <div class="filter-group">
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar por palabra clave..." style="min-width: 240px;">
        <select id="sortSelect" class="select-input">
          <option value="recent">Más recientes</option>
          <option value="price-asc">Precio: Menor a Mayor</option>
          <option value="price-desc">Precio: Mayor a Menor</option>
        </select>
      </div>

      <div class="filter-group">
        <button class="btn-filter active" data-type="all">Todos</button>
        <button class="btn-filter" data-type="vivienda">🏡 Viviendas (≤300k€)</button>
        <button class="btn-filter" data-type="garaje">🚗 Garajes (San Agustín)</button>
      </div>
    </div>

    <div class="grid-container" id="gridContainer">
      <!-- Tarjetas cargadas dinámicamente -->
    </div>
  </main>

  <footer>
    <p>Actualizado automáticamente mediante Antigravity y GitHub Pages.</p>
  </footer>

  <script>
    let allProperties = [];
    let currentFilterType = 'all';

    async function loadData() {
      try {
        const response = await fetch('data.json?t=' + Date.now());
        if (!response.ok) throw new Error('No se pudo cargar data.json');
        allProperties = await response.json();
      } catch (err) {
        console.warn('Cargando data.json:', err);
        allProperties = [];
      }
      render();
    }

    function parsePriceNumber(priceStr) {
      if (!priceStr || priceStr.toLowerCase().includes("consultar") || priceStr.toLowerCase().includes("especificado")) return 0;
      const num = priceStr.replace(/[^0-9]/g, '');
      return num ? parseInt(num, 10) : 0;
    }

    function render() {
      const container = document.getElementById('gridContainer');
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const sortVal = document.getElementById('sortSelect').value;

      let filtered = allProperties.filter(item => {
        const matchesType = (currentFilterType === 'all') || (item.tipo === currentFilterType);
        const textToSearch = `${item.titulo} ${item.zona} ${item.portal} ${item.precio} ${item.detalles || ''}`.toLowerCase();
        const matchesSearch = textToSearch.includes(searchVal);
        return matchesType && matchesSearch;
      });

      if (sortVal === 'price-asc') {
        filtered.sort((a, b) => parsePriceNumber(a.precio) - parsePriceNumber(b.precio));
      } else if (sortVal === 'price-desc') {
        filtered.sort((a, b) => parsePriceNumber(b.precio) - parsePriceNumber(a.precio));
      }

      document.getElementById('totalCount').innerText = `${filtered.length} Inmuebles Disponibles`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>No se encontraron inmuebles con estos filtros</h3>
            <p style="margin-top:0.5rem;">Intenta cambiar las palabras de búsqueda o seleccionar otra categoría.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div class="card">
          <div>
            <div class="card-tags">
              <span class="portal-tag">${item.portal}</span>
              <span class="type-tag ${item.tipo === 'garaje' ? 'type-garaje' : 'type-vivienda'}">
                ${item.tipo === 'garaje' ? '🚗 Garaje' : '🏡 Vivienda'}
              </span>
            </div>
            <div class="card-title">${item.titulo}</div>
            <div class="card-price">${item.precio}</div>
            <div class="card-details">${item.zona} ${item.detalles ? '• ' + item.detalles : ''}</div>
          </div>
          <div class="card-footer">
            <a href="${item.enlace}" target="_blank" rel="noopener" class="btn-link">
              Ver Inmueble en ${item.portal} ↗
            </a>
          </div>
        </div>
      `).join('');
    }

    // Listeners
    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('sortSelect').addEventListener('change', render);

    document.querySelectorAll('.btn-filter').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentFilterType = e.target.getAttribute('data-type');
        render();
      });
    });

    loadData();
  </script>
</body>
</html>
